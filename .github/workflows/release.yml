name: Publish to npm

on:
  release:
    types: [published]

# Same trigger as update-homebrew.yml so a single GitHub Release publishes
# to both npm and the Homebrew tap atomically.

permissions:
  contents: read
  id-token: write   # Required for npm provenance signing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        env:
          GH_REF: ${{ github.ref }}
        run: |
          # Tag format: v1.2.3 → strip 'v'
          TAG_VERSION="${GH_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            echo "Bump package.json before tagging the release."
            exit 1
          fi
          echo "Tag $TAG_VERSION matches package.json"

      # ccm ships a bash script (bin: ./ccm.sh) — no install, build, or test
      # step exists or is appropriate. Publish straight from the working tree;
      # the package.json "files" field controls what gets packed.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
